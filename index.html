<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe JavaScript Comment Remover & Minifier</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-ink: #ffffff;
      --border: #d1d5db;
      --good: #047857;
      --bad: #b91c1c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --ink: #f9fafb;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --accent-ink: #ffffff;
        --border: #374151;
        --good: #34d399;
        --bad: #f87171;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.25rem, 2.8vw, 2rem);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 920px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 420px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
      font-size: 0.88rem;
      line-height: 1.45;
      background: color-mix(in oklab, var(--panel) 94%, black 6%);
      color: var(--ink);
    }

    .status {
      margin-top: 12px;
      min-height: 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .ok { color: var(--good); }
    .err { color: var(--bad); }

    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Safe JavaScript Comment Remover & Minifier</h1>
      <p>
        Uses the <strong>Terser parser</strong> so comments are removed safely from real syntax,
        not by fragile string replacement. URLs like <code>"https://example.com"</code>, regex,
        and template strings remain valid.
      </p>

      <div class="controls">
        <button id="strip" class="primary">Remove comments only</button>
        <button id="minify">Minify to single line</button>
        <button id="copy">Copy output</button>
        <button id="sample">Load safe test sample</button>
      </div>

      <div class="grid">
        <div>
          <label for="input">Input JavaScript</label>
          <textarea id="input" spellcheck="false"></textarea>
        </div>
        <div>
          <label for="output">Output</label>
          <textarea id="output" spellcheck="false" readonly></textarea>
        </div>
      </div>

      <div id="status" class="status">Ready.</div>
      <div class="stats">
        <span id="inSize">Input size: 0 B</span>
        <span id="outSize">Output size: 0 B</span>
        <span id="saved">Saved: 0 B (0.0%)</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/terser@5.39.0/dist/bundle.min.js" defer></script>
  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const inSizeEl = document.getElementById('inSize');
    const outSizeEl = document.getElementById('outSize');
    const savedEl = document.getElementById('saved');

    const sample = `// Leading comment\nconst link = \"https://example.com/path?x=1//still-not-comment\";\n/* block comment */\nfunction demo(name) {\n  const pattern = /https?:\\/\\/[^\\s]+/g; // keep regex literal\n  const template = ` + "`Value: ${name} // not a comment`" + `;\n  return { link, pattern, template };\n}\nconsole.log(demo(\"Alice\"));`;

    inputEl.value = sample;
    updateStats();

    function bytes(value) {
      return new TextEncoder().encode(value).length;
    }

    function formatBytes(value) {
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${(value / (1024 * 1024)).toFixed(2)} MB`;
    }

    function setStatus(message, ok = true) {
      statusEl.textContent = message;
      statusEl.className = `status ${ok ? 'ok' : 'err'}`;
    }

    function updateStats() {
      const inSize = bytes(inputEl.value || '');
      const outSize = bytes(outputEl.value || '');
      const saved = Math.max(0, inSize - outSize);
      const pct = inSize ? (saved / inSize) * 100 : 0;
      inSizeEl.textContent = `Input size: ${formatBytes(inSize)}`;
      outSizeEl.textContent = `Output size: ${formatBytes(outSize)}`;
      savedEl.textContent = `Saved: ${formatBytes(saved)} (${pct.toFixed(1)}%)`;
    }

    async function processCode(mode) {
      const source = inputEl.value;
      if (!source.trim()) {
        outputEl.value = '';
        setStatus('Please enter JavaScript first.', false);
        updateStats();
        return;
      }

      if (!window.Terser || typeof window.Terser.minify !== 'function') {
        setStatus('Terser failed to load. Check your internet connection and retry.', false);
        return;
      }

      setStatus('Processing...');

      try {
        const isMinify = mode === 'minify';
        const result = await window.Terser.minify(source, {
          ecma: 2020,
          compress: isMinify
            ? {
                passes: 2,
                toplevel: false,
                unsafe_arrows: true
              }
            : false,
          mangle: isMinify,
          format: {
            comments: false,
            beautify: !isMinify,
            semicolons: true,
            quote_style: 3
          }
        });

        if (result.error) {
          throw result.error;
        }

        outputEl.value = result.code || '';
        setStatus(isMinify ? 'Minified successfully.' : 'Comments removed successfully.');
      } catch (error) {
        outputEl.value = '';
        setStatus(`Parse/minify error: ${error.message || String(error)}`, false);
      }

      updateStats();
    }

    document.getElementById('strip').addEventListener('click', () => processCode('strip'));
    document.getElementById('minify').addEventListener('click', () => processCode('minify'));

    document.getElementById('copy').addEventListener('click', async () => {
      if (!outputEl.value) {
        setStatus('No output to copy yet.', false);
        return;
      }
      try {
        await navigator.clipboard.writeText(outputEl.value);
        setStatus('Output copied to clipboard.');
      } catch {
        setStatus('Clipboard write failed. Your browser may block clipboard access here.', false);
      }
    });

    document.getElementById('sample').addEventListener('click', () => {
      inputEl.value = sample;
      outputEl.value = '';
      setStatus('Sample loaded.');
      updateStats();
    });

    inputEl.addEventListener('input', updateStats);
  </script>
</body>
</html>
